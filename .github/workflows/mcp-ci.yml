name: mcp-ci

on:
  push:
    branches: [main]
    paths:
      - 'packages/mcp/**'
      - 'packages/core/**'
      - 'apps/editor/app/api/scenes/**'
      - 'apps/editor/lib/scene-*'
      - 'apps/editor/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mcp-ci.yml'
  pull_request:
    paths:
      - 'packages/mcp/**'
      - 'packages/core/**'
      - 'apps/editor/app/api/scenes/**'
      - 'apps/editor/lib/scene-*'
      - 'apps/editor/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mcp-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Tests still use bun:test — install Bun for the test runner only.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --dir packages/core run build

      - name: Build mcp
        run: pnpm --dir packages/mcp run build

      - name: Test mcp
        run: bun test --cwd packages/mcp

      - name: Test editor scene API
        run: bun test apps/editor/lib/scene-store-server.test.ts apps/editor/lib/scene-api-security.test.ts

      - name: Biome check
        run: pnpm exec biome check packages/mcp apps/editor/lib/scene-store-server.ts apps/editor/lib/scene-api-security.ts apps/editor/app/api/scenes
